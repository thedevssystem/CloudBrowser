<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBrowser</title>

    <style>
        body{
            margin:0;
            background:#111827;
            color:white;
            font-family:Arial,Helvetica,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:360px;
            background:#1f2937;
            padding:30px;
            border-radius:14px;
            text-align:center;
            box-shadow:0 0 25px rgba(0,0,0,.4);
        }

        input{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>CloudBrowser</h1>

    <p>Secure Remote Browser</p>

    <input
        type="password"
        placeholder="Enter Password">

    <button>
        Connect
    </button>

</div>

</body>
</html>
