<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBrowser</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#111827;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:360px;
            background:#1f2937;
            padding:30px;
            border-radius:14px;
            text-align:center;
            box-shadow:0 0 25px rgba(0,0,0,.4);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            margin-bottom:15px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        #error{
            margin-top:15px;
            color:#ef4444;
            display:none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>☁️ CloudBrowser</h1>

    <p>Secure Remote Browser</p>

    <input
        id="password"
        type="password"
        placeholder="Enter Password">

    <button onclick="login()">
        Connect
    </button>

    <div id="error">
        Wrong password.
    </div>

</div>

<script>

async function login(){

    const password = document.getElementById("password").value;

    const response = await fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            password
        })

    });

    if(response.ok){

        window.location="/dashboard";

    }else{

        document.getElementById("error").style.display="block";

    }

}

</script>

</body>
</html>
